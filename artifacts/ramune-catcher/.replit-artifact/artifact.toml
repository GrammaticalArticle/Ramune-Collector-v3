kind = "web"
previewPath = "/"
title = "Ramune Catcher"
version = "1.0.0"
id = "artifacts/ramune-catcher"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25968

[services.development]
run = "pnpm --filter @workspace/ramune-catcher run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ramune-catcher", "run", "build" ]
publicDir = "artifacts/ramune-catcher/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25968"
BASE_PATH = "/"
