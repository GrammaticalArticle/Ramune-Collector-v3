openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Ramune Catcher API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: flavors
  - name: caught
  - name: locations
  - name: stats
  - name: users
  - name: friends
  - name: scan
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /flavors:
    get:
      operationId: listFlavors
      tags: [flavors]
      summary: List all ramune flavors
      responses:
        "200":
          description: List of flavors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Flavor"

  /flavors/{id}:
    get:
      operationId: getFlavor
      tags: [flavors]
      summary: Get a single flavor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The flavor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flavor"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /flavors/barcode/{barcode}:
    get:
      operationId: getFlavorByBarcode
      tags: [flavors]
      summary: Look up a flavor by barcode (checks primary and alternate barcodes)
      parameters:
        - name: barcode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The flavor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flavor"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /flavors/{id}/barcode:
    patch:
      operationId: setFlavorBarcode
      tags: [flavors]
      summary: Set the primary barcode for a flavor (tima only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetFlavorBarcodeBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flavor"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Barcode already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /flavors/{id}/barcodes:
    get:
      operationId: listFlavorBarcodes
      tags: [flavors]
      summary: List all alternate barcodes for a flavor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of barcodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlavorBarcode"
    post:
      operationId: addFlavorBarcode
      tags: [flavors]
      summary: Add an alternate barcode to a flavor (tima only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddFlavorBarcodeBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlavorBarcode"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Barcode already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /flavors/{id}/barcodes/{barcode}:
    delete:
      operationId: deleteFlavorBarcode
      tags: [flavors]
      summary: Remove an alternate barcode (tima only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: barcode
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /caught:
    get:
      operationId: listCaught
      tags: [caught]
      summary: List all caught flavor IDs for a user
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of caught records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaughtFlavor"
    post:
      operationId: catchFlavor
      tags: [caught]
      summary: Mark a flavor as caught
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatchFlavorBody"
      responses:
        "201":
          description: Caught successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaughtFlavor"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already caught
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /caught/{flavorId}:
    delete:
      operationId: uncatchFlavor
      tags: [caught]
      summary: Remove a caught flavor
      parameters:
        - name: flavorId
          in: path
          required: true
          schema:
            type: integer
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /locations:
    get:
      operationId: listLocations
      tags: [locations]
      summary: List all snack map locations
      responses:
        "200":
          description: List of locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
    post:
      operationId: createLocation
      tags: [locations]
      summary: Add a new snack location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocationBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /locations/{id}:
    get:
      operationId: getLocation
      tags: [locations]
      summary: Get a location with its confirmed flavors
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationWithFlavors"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateLocation
      tags: [locations]
      summary: Update a location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocationBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteLocation
      tags: [locations]
      summary: Delete a location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /locations/{id}/verify:
    patch:
      operationId: verifyLocation
      tags: [locations]
      summary: Mark a location as verified or unverified (tima only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyLocationBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /locations/{id}/flavors:
    post:
      operationId: addLocationFlavor
      tags: [locations]
      summary: Add a confirmed flavor to a location with optional price
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddLocationFlavorBody"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationFlavor"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: removeLocationFlavor
      tags: [locations]
      summary: Remove a confirmed flavor from a location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveLocationFlavorBody"
      responses:
        "204":
          description: Removed
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get overall collection stats
      parameters:
        - name: username
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create or get a user by username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "200":
          description: User created or retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{username}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by username
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{username}/friends:
    get:
      operationId: getFriends
      tags: [friends]
      summary: Get friends list for a user
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of friends
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: addFriend
      tags: [friends]
      summary: Add a friend
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddFriendBody"
      responses:
        "201":
          description: Friend added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already friends
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{username}/friends/{friendUsername}:
    delete:
      operationId: removeFriend
      tags: [friends]
      summary: Remove a friend
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: friendUsername
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Flavor:
      type: object
      properties:
        id:
          type: integer
        japaneseName:
          type: string
          description: Japanese name (primary)
        name:
          type: string
          description: English name (secondary)
        barcode:
          type: string
          nullable: true
        color:
          type: string
          description: Hex color representing the flavor
        brand:
          type: string
          description: Brand name e.g. Hata, Doraemon, Sangaria
        category:
          type: string
          description: Category e.g. standard, limited, savory, doraemon
        sortOrder:
          type: integer
        description:
          type: string
        imageUrl:
          type: string
          description: Product image URL
      required:
        - id
        - japaneseName
        - name
        - color
        - brand
        - category
        - sortOrder

    FlavorBarcode:
      type: object
      properties:
        id:
          type: integer
        flavorId:
          type: integer
        barcode:
          type: string
        region:
          type: string
          description: Region code e.g. JP, EU, US
        addedBy:
          type: string
        addedAt:
          type: string
          format: date-time
      required:
        - id
        - flavorId
        - barcode
        - region
        - addedAt

    SetFlavorBarcodeBody:
      type: object
      properties:
        barcode:
          type: string
        addedBy:
          type: string
      required:
        - barcode
        - addedBy

    AddFlavorBarcodeBody:
      type: object
      properties:
        barcode:
          type: string
        region:
          type: string
        addedBy:
          type: string
      required:
        - barcode
        - region

    CaughtFlavor:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        flavorId:
          type: integer
        caughtAt:
          type: string
          format: date-time
      required:
        - id
        - username
        - flavorId
        - caughtAt

    CatchFlavorBody:
      type: object
      properties:
        flavorId:
          type: integer
        username:
          type: string
      required:
        - flavorId
        - username

    Location:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        city:
          type: string
        country:
          type: string
        lat:
          type: number
        lng:
          type: number
        confirmedCount:
          type: integer
        addedBy:
          type: string
        verified:
          type: boolean
          description: Whether this location has been verified by tima
        verifiedBy:
          type: string
          description: Username who verified the location
        flavorColors:
          type: array
          items:
            type: string
          description: Hex colors of confirmed flavors (for map markers)
      required:
        - id
        - name
        - city
        - country
        - lat
        - lng
        - confirmedCount
        - verified

    LocationWithFlavors:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        city:
          type: string
        country:
          type: string
        lat:
          type: number
        lng:
          type: number
        confirmedCount:
          type: integer
        addedBy:
          type: string
        verified:
          type: boolean
          description: Whether this location has been verified by tima
        verifiedBy:
          type: string
          description: Username who verified the location
        flavors:
          type: array
          items:
            $ref: "#/components/schemas/LocationFlavorEntry"
      required:
        - id
        - name
        - city
        - country
        - lat
        - lng
        - confirmedCount
        - verified
        - flavors

    VerifyLocationBody:
      type: object
      properties:
        verified:
          type: boolean
        verifiedBy:
          type: string
      required:
        - verified
        - verifiedBy

    LocationFlavorEntry:
      type: object
      properties:
        flavor:
          $ref: "#/components/schemas/Flavor"
        price:
          type: number
          description: Price in local currency
        currency:
          type: string
          description: Currency code e.g. SEK, JPY, USD
        addedBy:
          type: string
          description: Username who confirmed this
        addedAt:
          type: string
          format: date-time
      required:
        - flavor
        - addedAt

    LocationFlavor:
      type: object
      properties:
        id:
          type: integer
        locationId:
          type: integer
        flavorId:
          type: integer
        price:
          type: number
        currency:
          type: string
        addedBy:
          type: string
        addedAt:
          type: string
          format: date-time
      required:
        - id
        - locationId
        - flavorId
        - addedAt

    CreateLocationBody:
      type: object
      properties:
        name:
          type: string
        city:
          type: string
        country:
          type: string
        lat:
          type: number
        lng:
          type: number
        addedBy:
          type: string
      required:
        - name
        - city
        - country
        - lat
        - lng

    AddLocationFlavorBody:
      type: object
      properties:
        flavorId:
          type: integer
        price:
          type: number
        currency:
          type: string
        addedBy:
          type: string
      required:
        - flavorId

    RemoveLocationFlavorBody:
      type: object
      properties:
        flavorId:
          type: integer
      required:
        - flavorId

    Stats:
      type: object
      properties:
        totalFlavors:
          type: integer
        caughtFlavors:
          type: integer
        totalLocations:
          type: integer
        recentlyCaught:
          type: array
          items:
            $ref: "#/components/schemas/CaughtFlavor"
      required:
        - totalFlavors
        - caughtFlavors
        - totalLocations
        - recentlyCaught

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - username
        - displayName
        - createdAt

    CreateUserBody:
      type: object
      properties:
        username:
          type: string
        displayName:
          type: string
      required:
        - username
        - displayName

    AddFriendBody:
      type: object
      properties:
        friendUsername:
          type: string
      required:
        - friendUsername

    ScanLabelBody:
      type: object
      properties:
        imageBase64:
          type: string
          description: Base64-encoded image of the ramune label
      required:
        - imageBase64

    ScanLabelResult:
      type: object
      properties:
        flavor:
          $ref: "#/components/schemas/Flavor"
        extractedText:
          type: string
        confidence:
          type: string
      required:
        - flavor
        - extractedText
        - confidence
